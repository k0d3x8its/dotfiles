# Sidebar terminal — overlays ~/.config/ghostty/config
# Ghostty renders one column fewer than window-width asks for under
# XWayland + window-decoration=false, so 81 is what actually yields the 80
# columns btop needs before it refuses to draw.
window-width = 81
window-height = 51
window-decoration = false
keybind = ctrl+alt+q=quit
