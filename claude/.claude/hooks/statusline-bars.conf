# shellcheck shell=bash
# statusline-bars.conf — config for statusline-bars.sh (sourced by the hook).
#
# `:=` assignment keeps any value already in the environment, so settings.json `env`
# (if Claude Code injects it into the statusLine subprocess) overrides these. The conf
# is the guaranteed path; env is an optional override.
#
# All token values are in EXCL-cache-read units (D5: input + output + cacheCreation).
# These are CONFIGURED caps, not detected — see findings.md "Ground-truth revision":
# p90-of-completed-blocks measured usage habit (~700K), not the cap (~10M), so detection
# was abandoned for both bars.
#
# Calibrated 2026-06-16 against Claude Code's own usage bars (precise readings):
#   5hr    : 312K consumed = 17% shown  ->  cap ≈ 1.84M
#   weekly : 2.71M since Sat reset = 27% ->  cap ≈ 10.0M
# (An earlier 1%/25% reading was too coarse and gave a 10M 5hr estimate — 5.4x too big.
#  RECALIBRATE if drift returns: CAP = consumption * 100 / shown_pct, at the highest % seen.
#  5hr cap <= weekly cap always — one block can't exceed the weekly budget.)

: "${STATUSLINE_5H_CAP:=1840000}"
: "${STATUSLINE_WEEKLY_CAP:=10000000}"

# Weekly reset anchor — wall clock in the given TZ (DST handled by zoneinfo).
: "${STATUSLINE_WEEKLY_RESET_TZ:=America/New_York}"
: "${STATUSLINE_WEEKLY_RESET_DOW:=6}"      # 1=Mon … 6=Sat … 7=Sun
: "${STATUSLINE_WEEKLY_RESET_HHMM:=17:59}"

export STATUSLINE_5H_CAP STATUSLINE_WEEKLY_CAP \
       STATUSLINE_WEEKLY_RESET_TZ STATUSLINE_WEEKLY_RESET_DOW STATUSLINE_WEEKLY_RESET_HHMM
