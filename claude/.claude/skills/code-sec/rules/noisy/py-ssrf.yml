id: py-ssrf-requests
language: python
severity: warning
message: Possible SSRF — non-literal URL with no visible allowlist (CWE-918)
metadata: {cwe: CWE-918, reachable: true}
rule:
  pattern: "requests.$M($URL, $$$)"
  not:
    inside:
      kind: function_definition
      stopBy: end
      has:
        pattern: "urlparse($$$)"
        stopBy: end
constraints:
  URL:
    regex: "^[a-z_]"
